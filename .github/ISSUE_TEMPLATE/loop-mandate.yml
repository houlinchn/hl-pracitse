name: Loop Mandate
description: 由人授权一个有明确范围和停止条件的 AI 开发循环
title: "[Loop Mandate]: "
body:
  - type: markdown
    attributes:
      value: |
        AI Loop 默认关闭。只有人完成审核并将本 Issue 移到 Ready 后，Mandate 才生效。
  - type: textarea
    id: goal
    attributes:
      label: Loop 目标
      description: 描述本轮循环必须完成的业务结果。
    validations:
      required: true
  - type: input
    id: milestone
    attributes:
      label: Milestone
      description: 本 Loop 所属的已批准 Milestone。
    validations:
      required: true
  - type: textarea
    id: allowed_work
    attributes:
      label: 允许处理的工作
      description: Issue 类型、标签、Epic 和其他筛选条件。
    validations:
      required: true
  - type: dropdown
    id: risk_levels
    attributes:
      label: 允许自动继续的风险等级
      multiple: true
      options:
        - L0 - 快速改动
        - L1 - 标准改动
        - L2 - 关键改动
    validations:
      required: true
  - type: textarea
    id: concurrency
    attributes:
      label: 并行与在制品限制
      description: 最大并行任务数、最大 In Progress 数和每轮限制。
    validations:
      required: true
  - type: textarea
    id: issue_permissions
    attributes:
      label: Issue 权限
      description: AI 可以创建、修改、转换状态和关闭哪些 Issue？
    validations:
      required: true
  - type: textarea
    id: git_permissions
    attributes:
      label: Git 与 PR 权限
      description: 明确分支、提交、推送、创建 PR、批准和合并权限。
    validations:
      required: true
  - type: textarea
    id: human_gates
    attributes:
      label: 人工门禁
      description: 列出始终必须由人批准的决定和操作。
    validations:
      required: true
  - type: textarea
    id: stop_conditions
    attributes:
      label: 停止条件
      description: 除规范默认停止条件外，本 Mandate 的额外停止条件。
    validations:
      required: true
  - type: textarea
    id: completion
    attributes:
      label: 完成条件
      description: 哪些可验证结果代表 Loop 已完成？
    validations:
      required: true
  - type: checkboxes
    id: authorization
    attributes:
      label: 人工授权
      description: 此项只能由授权人确认。
      options:
        - label: 我已审核目标、权限、风险等级和停止条件，并授权在这些限制内运行 AI Loop。
          required: true
