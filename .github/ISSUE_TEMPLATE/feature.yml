name: Feature
description: 提出一个可独立交付和验收的用户能力
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Feature 必须经过人工审核并进入 Ready 后，AI 才能开始实现。
  - type: textarea
    id: outcome
    attributes:
      label: 预期业务结果
      description: 谁需要什么能力，完成后可观察到什么结果？
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 背景和依据
      description: 链接相关 Epic、产品、Feature 或架构文档，并说明为什么需要它。
    validations:
      required: true
  - type: textarea
    id: in_scope
    attributes:
      label: In Scope
      description: 本 Issue 必须交付的内容。
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of Scope
      description: 容易被误解为本次范围、但明确不做的内容。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 使用可验证的行为描述，每条标准只表达一个结果。
      placeholder: |
        - [ ] Given ... When ... Then ...
        - [ ] Given ... When ... Then ...
    validations:
      required: true
  - type: input
    id: parent
    attributes:
      label: Epic / Milestone
      description: 链接父 Epic，并写明所属 Milestone。
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: 依赖关系
      description: 列出阻塞和被阻塞的 Issue；没有则写 none。
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: 优先级
      options:
        - P0 - 紧急
        - P1 - 高
        - P2 - 普通
        - P3 - 低
    validations:
      required: true
  - type: dropdown
    id: risk
    attributes:
      label: 风险等级
      description: 不确定时选择更高等级。
      options:
        - L0 - 快速改动
        - L1 - 标准改动
        - L2 - 关键改动
    validations:
      required: true
  - type: textarea
    id: data_security
    attributes:
      label: 数据、权限和安全影响
      description: 说明数据结构、迁移、权限、隐私、审计和安全影响；没有则写 none。
    validations:
      required: true
  - type: textarea
    id: ai_parity
    attributes:
      label: 管理员与 AI 能力对等
      description: 管理员能够查看或执行什么？对应的 AI 查询或操作工具是什么？不适用时说明原因。
    validations:
      required: true
  - type: textarea
    id: docs
    attributes:
      label: 长期文档影响
      description: 列出需要更新的文档；没有则写 none。
    validations:
      required: true
  - type: checkboxes
    id: ready_check
    attributes:
      label: 提交前检查
      options:
        - label: 我已提供可独立验证的范围和验收标准。
          required: true
        - label: 我已列出所有已知的阻塞性业务决策。
          required: true
