name: Research
description: 获取事实、验证方案或为一个待决问题提供建议
title: "[Research]: "
body:
  - type: textarea
    id: question
    attributes:
      label: 要回答的问题
      description: 用一个明确问题描述本次调研，不直接预设结论。
    validations:
      required: true
  - type: textarea
    id: decision
    attributes:
      label: 支持的决策
      description: 调研结果将用于做什么决定？谁负责最终决定？
    validations:
      required: true
  - type: textarea
    id: known_facts
    attributes:
      label: 已知事实和来源
      description: 列出现有代码、文档、数据或外部一手来源。
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 调研范围
      description: 分别写明 In Scope 和 Out of Scope。
    validations:
      required: true
  - type: textarea
    id: deliverable
    attributes:
      label: 交付物
      description: 例如建议、原型、测量结果或 ADR 草案。Research 不直接交付生产功能。
    validations:
      required: true
  - type: textarea
    id: exit_criteria
    attributes:
      label: 完成标准
      description: 具备哪些证据后可以结束调研？
    validations:
      required: true
  - type: input
    id: parent
    attributes:
      label: Epic / Milestone
      description: 关联父 Epic 或所属 Milestone；没有则写 none。
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: 依赖和限制
      description: 包括访问权限、时间、成本和样本限制；没有则写 none。
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: 优先级
      options:
        - P0 - 紧急
        - P1 - 高
        - P2 - 普通
        - P3 - 低
    validations:
      required: true
  - type: textarea
    id: docs
    attributes:
      label: 结果保存位置
      description: 指定 Issue 评论、Feature 文档、架构文档或 ADR 草案。避免重复保存。
    validations:
      required: true
