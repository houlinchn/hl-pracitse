name: Epic
description: 定义一个需要多个 Issue 交付的完整业务成果
title: "[Epic]: "
body:
  - type: markdown
    attributes:
      value: |
        Epic 只定义稳定成果、范围和成功标准。具体开发工作必须拆成 Feature、Bug、Chore 或 Research Issue。
  - type: textarea
    id: outcome
    attributes:
      label: 业务成果
      description: 完成后用户或业务获得什么结果？
      placeholder: 描述可观察的最终结果，不要只列实现任务。
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 背景
      description: 为什么现在需要这个成果？
    validations:
      required: true
  - type: textarea
    id: in_scope
    attributes:
      label: In Scope
      description: 本 Epic 明确包含什么？
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of Scope
      description: 本 Epic 明确不包含什么？
    validations:
      required: true
  - type: textarea
    id: success
    attributes:
      label: 成功标准
      description: 哪些结果能证明 Epic 已完成？
    validations:
      required: true
  - type: textarea
    id: child_plan
    attributes:
      label: 子 Issue 计划
      description: 列出已有子 Issue，或说明计划如何拆解。
      placeholder: |
        - [ ] #123
        - [ ] 待创建：管理员查看申请列表
    validations:
      required: true
  - type: input
    id: milestone
    attributes:
      label: Milestone
      description: 所属发布阶段或 Milestone。
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: 依赖和约束
      description: 关联 Issue、外部依赖和不可突破的限制。
    validations:
      required: true
  - type: textarea
    id: docs
    attributes:
      label: 长期文档影响
      description: 链接需要新增或更新的产品、Feature、架构、ADR 或领域文档；没有则写 none。
    validations:
      required: true
